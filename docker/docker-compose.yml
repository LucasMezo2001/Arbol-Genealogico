services:
  postgres:
    image: postgres:16-alpine
    container_name: arbol_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arbol}
      POSTGRES_USER: ${POSTGRES_USER:-arbol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arbol}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volumen con nombre (gestionado por Docker Desktop) en vez de bind mount a
      # una ruta NTFS: los bind mounts de Windows no soportan el chmod que hace
      # initdb sobre PGDATA y el arranque falla con "Operation not permitted".
      # Para que el disco de Docker Desktop (y por tanto estos datos) vivan
      # físicamente en D:, ver README > "Alojar Docker Desktop en D:".
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arbol} -d ${POSTGRES_DB:-arbol}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: arbol_pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pg_data:
    name: arbol_pg_data
  pgadmin_data:
    name: arbol_pgadmin_data
