[tool.poetry]
name = "arbol-genealogico"
version = "0.1.0"
description = "Aplicación de árbol genealógico"
authors = ["Lucas Mezo <lucasmezo2001@gmail.com>"]
readme = "README.md"
packages = [
  { include = "arbol_genealogico", from = "src" }
]

[tool.poetry.scripts]
arbol = "arbol_genealogico.entrypoints.cli:app"

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.12.5"
pydantic-settings = "^2.0.0"
pyyaml = "^6.0.3"
typer = ">=0.16.0"
httpx = {extras = ["http2"], version = "^0.28.1"}
tenacity = "^9.1.4"
beautifulsoup4 = "^4.15.0"
lxml = "^6.1.1"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.52"}
asyncpg = "^0.31.0"
alembic = "^1.19.1"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.5.0"
pytest = "^8.0.0"
ruff = "^0.8.0"
pytest-asyncio = "^1.4.0"
respx = "^0.23.1"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/arbol_genealogico/infrastructure/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
